# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:win_space_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus --no-desktop
$menu = wofi --show drun --columns=4 --width=1400
$browser = firefox
$LAUNCHER = walker -m applications
$CLIPBOARD = walker -m clipboard
$EMOJI = walker -m emojis
$WALLPAPER = walker -n -m wallpaper
$POWER = walker -m power




###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod CTRL, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, U, togglesplit, # dwindle
bind = $mainMod, F, fullscreen

# Open Apps
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $fileManager

# Screenshot binds
bind = $mainMod, PRINT, exec, hyprshot -m output --clipboard-only
bind = SHIFT, PRINT, exec, hyprshot -m region --clipboard-only
bind = CTRL, PRINT, exec, hyprshot -m window --clipboard-only
bind = ALT, PRINT, exec, mkdir -p ~/Pictures/Screenshots && hyprshot -m output
bind = SHIFT ALT, PRINT, exec, mkdir -p ~/Pictures/Screenshots && hyprshot -m region
bind = CTRL ALT, PRINT, exec, mkdir -p ~/Pictures/Screenshots && hyprshot -m window

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bindel = $mainMod SHIFT, H, exec, ~/.config/hypr/scripts/smart_move.sh left
bindel = $mainMod SHIFT, L, exec, ~/.config/hypr/scripts/smart_move.sh right
bindel = $mainMod SHIFT, K, exec, ~/.config/hypr/scripts/smart_move.sh up
bindel = $mainMod SHIFT, J, exec, ~/.config/hypr/scripts/smart_move.sh down

# Window resizing                        X   Y
bindel = $mainMod CTRL, H, resizeactive, -30 0
bindel = $mainMod CTRL, L, resizeactive, 30  0
bindel = $mainMod CTRL, K, resizeactive, 0   -30
bindel = $mainMod CTRL, J, resizeactive, 0   30

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, M, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, ~/.config/hypr/scripts/osd_notify.sh volume-up
bindel = ,XF86AudioLowerVolume, ~/.config/hypr/scripts/osd_notify.sh volume-down
bindel = ,XF86AudioMute, exec, ~/.config/hypr/scripts/osd_notify.sh volume-mute

bindel = ,XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/osd_notify.sh brightness-up
bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/osd_notify.sh brightness-down

# Requires playerctl
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

# Change layout
bind = $mainMod, O, exec, hyprctl keyword general:layout "dwindle" && notify-send "Layout: dwindle"
bind = $mainMod SHIFT, O, exec, hyprctl keyword general:layout "master" && notify-send "Layout: master"
